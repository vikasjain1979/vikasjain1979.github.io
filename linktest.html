<!DOCTYPE html>
<html lang="en">
<head>https://github.com/vikasjain1979/vikasjain1979.github.io/blob/main/linktest.html
  <meta charset="UTF-8">
  <title>Contact Support - 1.4 </title>
</head>
<body>
  <p>Opening your email app...</p>
  <!-- Best & most reliable: A standard styled link -->
  <a id="fallback-link" href="mailto:support1@example.com?subject=Dashboard%20Update&body=Hi%20team,">
    Click here
  </a>
<!--<a href="mailto:support@example.com?subject=Dashboard%20Update&body=Hi%20team," class="btn">
  Compose Email
</a>-->

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const mailtoUrl = document.getElementById("fallback-link").href;
      
      // Attempt automatic launch (works in some desktop browsers/webviews, blocked in others)
      window.location.href = mailtoUrl;
    });
  </script>
</body>
</html>
